[env:esp32-dev]
platform = espressif32@7.0.1
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 460800

build_flags = 
    -DCORE_DEBUG_LEVEL=1
    -DESP32
    -std=c++17
    -include src/compat_fixes.h
    ; PSRAM support - verified against official PlatformIO docs. Kept
    ; from the earlier ESP32-CAM plan (now abandoned in favor of this
    ; genuine ESP32-WROVER-DEV board) since both are classic ESP32 +
    ; QSPI PSRAM, so the same flags apply.
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue

; board = esp32dev ("Espressif ESP32 Dev Module"), not esp-wrover-kit -
; confirmed via a real PlatformIO forum thread with the identical
; situation (a generic WROVER-based DevKitC-style board, not Espressif's
; own official kit). esp-wrover-kit is specifically for Espressif's own
; full-featured board (built-in LCD, microSD slot, JTAG debugger via an
; FTDI chip) - none of which this simple breakout board has, and that
; thread's own poster confirmed esp-wrover-kit gives wrong flash-size
; defaults for a board like this.
board_build.arduino.memory_type = qio_qspi

board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L
board_build.flash_mode = dio

; huge_app.csv sized for 4MB flash - matches Espressif's own
; ESP32-WROVER datasheet ("4 MB of external SPI flash and an 8 MB
; PSRAM"), but not yet confirmed against this specific board's actual
; build log the way it was for the previous DevKit V1 (that
; confirmation doesn't carry over to different hardware). Worth
; double-checking your first build log's flash-size line once you flash
; this - if it reports something other than 4MB, let me know and I'll
; resize this partition table to match.
board_build.partitions = huge_app.csv

; V1 reproducible dependency baseline. These are the exact versions that
; resolved in the verified PlatformIO environment; do not upgrade them as
; part of V1 maintenance without a clean build and hardware regression test.
lib_deps = 
    ZinggJM/GxEPD2@1.6.9
    adafruit/Adafruit GFX Library@1.12.6
    adafruit/Adafruit BusIO@1.17.4
    thomasfredericks/Bounce2@2.72
    bblanchon/ArduinoJson@7.4.3
    https://github.com/pschatzmann/ESP32-A2DP.git#3245602afc494f9e62160a0cfb2af864af45a37f
    ; Real MP3 decoding (Helix decoder via AudioGeneratorMP3a) - chosen
    ; over the more commonly-recommended ESP32-audioI2S library because
    ; that one hard-requires PSRAM (verified directly in its source:
    ; `if (!psramFound) { result = false; goto exit; }`), which this
    ; board (DOIT ESP32 DEVKIT V1) almost certainly doesn't have. This
    ; library has no PSRAM dependency anywhere (verified by grep against
    ; the actual source) - it's designed to also run on plain ESP8266.
    ; Pinned to the commit right before this library migrated to ESP-IDF
    ; 6.0's newer i2s_std.h driver (see e0143bb "ESP IDF 6.0 compat" in
    ; the library's history) - this board's bundled ESP-IDF is 5.x
    ; (Arduino core 3.x), a full major version behind what that migration
    ; needs, which is exactly what caused "fatal error: driver/i2s_std.h:
    ; No such file or directory". This pinned commit still uses the legacy
    ; driver/i2s.h API instead - the same one the Bluetooth library above
    ; already uses successfully on this exact toolchain (proven working).
    ; Verified every class/method this code calls (AudioFileSourceICYStream,
    ; AudioFileSourceBuffer, AudioGeneratorMP3a, AudioOutputI2S::SetPinout/
    ; SetGain) is present at this exact commit before pinning to it.
    https://github.com/earlephilhower/ESP8266Audio.git#058e131b26e459b9aadcb589a50f07877f1a09fd

lib_ldf_mode = chain+

; Keep the established pre-IDF-6 ESP8266Audio revision, but apply the
; upstream AAC+/SBR output-buffer fix before each build. The later upstream
; revision containing this fix also switches I2S to the ESP-IDF 6 API, which
; is incompatible with this project's Arduino-ESP32 2.x framework.
extra_scripts = pre:tools/patch_esp8266audio_aac.py
